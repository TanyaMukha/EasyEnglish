<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EasyPeasy</title>
    <base href="/" />

    <!-- Loading CSS from a library via _content/ -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link href="css/tablet-landscape.css" rel="stylesheet" />
    <link rel="stylesheet" href="EasyEnglish.App.styles.css" />
    <link rel="icon" href="data:,">

    <style>
        .loading-screen {
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, #E8F2FF 0%, #E8F8F5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .app-name {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #A3BFFA 0%, #B5EAD7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -1px;
            animation: fadeInUp 0.8s ease-out;
        }

        .tagline {
            font-size: 20px;
            color: #5A8BB8;
            font-weight: 500;
            opacity: 0.95;
            animation: fadeInUp 1s ease-out;
            margin-bottom: 50px;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            animation: fadeInUp 1.2s ease-out;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #A3BFFA;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            40% {
                transform: translateY(-20px);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #B5EAD7;
            border-radius: 50%;
            box-shadow: 0 0 8px #B5EAD7;
            animation: sparkle 2.5s ease-in-out infinite;
        }

        .sparkle:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 30%;
            right: 25%;
            animation-delay: 0.4s;
        }

        .sparkle:nth-child(3) {
            bottom: 30%;
            left: 15%;
            animation-delay: 0.8s;
        }

        .sparkle:nth-child(4) {
            bottom: 25%;
            right: 20%;
            animation-delay: 1.2s;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-screen">
            <div class="sparkles">
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
            </div>

            <div class="app-name">EasyPeasy</div>
            <div class="tagline">Easy steps, big progress</div>

            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/downloadHelper.js"></script>
    <script src="js/keyboard-not-capitalize-first-letter.js"></script>

    <script>
        const contextMenuListeners = new Map();

        window.initContextMenu = function (menuId, menuElementId, dotnetHelper) {
            const clickHandler = function (e) {
                // Перевірити чи клік НЕ всередині меню
                const menuElement = document.getElementById(menuElementId);
                if (menuElement && !menuElement.contains(e.target)) {
                    dotnetHelper.invokeMethodAsync('HideMenu');
                }
            };

            // Невелика затримка, щоб меню встигло відрендеритися
            setTimeout(() => {
                document.addEventListener('click', clickHandler, true);
            }, 10);

            contextMenuListeners.set(menuId, {
                clickHandler,
                dotnetHelper
            });
        };

        window.disposeContextMenu = function (menuId) {
            const listener = contextMenuListeners.get(menuId);
            if (listener) {
                document.removeEventListener('click', listener.clickHandler, true);
                contextMenuListeners.delete(menuId);
            }
        };

        window.copyText = async function (elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const selectedText = element.value.substring(element.selectionStart, element.selectionEnd);
                if (selectedText) {
                    await navigator.clipboard.writeText(selectedText);
                } else {
                    await navigator.clipboard.writeText(element.value);
                }
            }
        };

        window.cutText = async function (elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const selectedText = element.value.substring(element.selectionStart, element.selectionEnd);
                if (selectedText) {
                    await navigator.clipboard.writeText(selectedText);
                    const start = element.selectionStart;
                    const end = element.selectionEnd;
                    element.value = element.value.substring(0, start) + element.value.substring(end);
                    element.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }
        };

        window.pasteText = async function (elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                const text = await navigator.clipboard.readText();
                const start = element.selectionStart;
                const end = element.selectionEnd;
                element.value = element.value.substring(0, start) + text + element.value.substring(end);
                element.dispatchEvent(new Event('input', { bubbles: true }));
                return element.value;
            }
            return '';
        };

        window.clearText = function (elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.value = '';
                element.dispatchEvent(new Event('input', { bubbles: true }));
            }
        };
    </script>

    <script>
        const selectableTextListeners = new Map();

        window.initSelectableText = function (elementId, dotnetHelper) {
            const element = document.getElementById(elementId);
            if (!element) return;

            const contextMenuHandler = function (e) {
                const selectedText = window.getSelection().toString().trim();
                const selection = window.getSelection();

                if (selectedText && selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    if (element.contains(range.commonAncestorContainer)) {
                        e.preventDefault();
                        e.stopPropagation();
                        dotnetHelper.invokeMethodAsync('ShowMenu', e.clientX, e.clientY);
                    }
                }
            };

            const clickHandler = function (e) {
                const selectedText = window.getSelection().toString().trim();
                if (!selectedText) {
                    dotnetHelper.invokeMethodAsync('HideMenu');
                }
            };

            const selectionChangeHandler = function () {
                const selectedText = window.getSelection().toString().trim();
                const selection = window.getSelection();

                if (!selectedText || (selection.rangeCount > 0 && !element.contains(selection.getRangeAt(0).commonAncestorContainer))) {
                    dotnetHelper.invokeMethodAsync('HideMenu');
                }
            };

            element.addEventListener('contextmenu', contextMenuHandler);
            document.addEventListener('click', clickHandler);
            document.addEventListener('selectionchange', selectionChangeHandler);

            selectableTextListeners.set(elementId, {
                contextMenuHandler,
                clickHandler,
                selectionChangeHandler,
                element
            });
        };

        window.copySelectedText = function () {
            const selectedText = window.getSelection().toString();
            if (selectedText) {
                try {
                    navigator.clipboard.writeText(selectedText);
                    return selectedText;
                } catch (err) {
                    console.error('Failed to copy text:', err);
                    return '';
                }
            }
            return '';
        };

        window.disposeSelectableText = function (elementId) {
            const listeners = selectableTextListeners.get(elementId);
            if (listeners) {
                const { element, contextMenuHandler, clickHandler, selectionChangeHandler } = listeners;
                element.removeEventListener('contextmenu', contextMenuHandler);
                document.removeEventListener('click', clickHandler);
                document.removeEventListener('selectionchange', selectionChangeHandler);
                selectableTextListeners.delete(elementId);
            }
        };
    </script>
</body>

</html>
