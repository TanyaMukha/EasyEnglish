<head>

    <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/utilities.css" />

    <link href="css/tablet-landscape.css" rel="stylesheet" />

    <link rel="icon" href="data:,">

    <script>
        // Тема має бути виставлена ДО першого рендеру, інакше буде спалах світлої теми
        (function () {
            var theme = 'light';
            try { theme = localStorage.getItem('theme') || 'light'; } catch (e) { }
            document.documentElement.setAttribute('data-theme', theme);

            window.themeHelper = {
                get: function () {
                    return document.documentElement.getAttribute('data-theme') || 'light';
                },
                toggle: function () {
                    var next = this.get() === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('theme', next); } catch (e) { }
                    return next;
                }
            };
        })();
    </script>

    <style>
        /* Поки Blazor не змонтувався — суцільний фон у кольорі splash-екрану.
           Це прибирає білий спалах між стартом WebView і першим рендером Razor. */
        html, body {
            margin: 0;
            padding: 0;
            background: #5b9fd4; /* середній тон градієнту SplashScreen */
            height: 100%;
            /*            overflow: hidden;*/
        }

        #app {
            height: 100%;
        }
    </style>
</head>

<body>

</body>
